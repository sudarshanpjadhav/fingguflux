name: Bug Report
description: File a bug report to help us improve FingguFlux
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Please provide a link to a reproduction or paste a minimal code snippet.
    validations:
      required: true
  - type: input
    id: adapter-version
    attributes:
      label: FingguFlux Version / Adapter
      description: e.g. @finggu/react v0.9.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Framework version (e.g. Next.js 14, Vite 5)
